# Every suite, on every pull request and on every push to main. The
# environment is tests/Dockerfile, the same one a person can run locally.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version format and monotonicity
        run: bash tests/check-version-bump.sh
      - name: Check pull request carries a version bump
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=50
          bash tests/check-version-bump.sh --base "origin/${{ github.base_ref }}"
  suites:
    runs-on: ubuntu-latest
    # The catalog grew (100 settings, three structured suites): the full run
    # needs the room the old 20-minute budget no longer gives it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the test image
        run: docker build -f tests/Dockerfile -t replicant-tests .
      - name: Run every suite
        run: docker run --rm replicant-tests
  # Required real-Omarchy validation on a disposable graphical session.
  # Disposable-runner contract (never the active installation or the private
  # data repo): a fresh Omarchy session separate from daily use, with the
  # plugin installed from file://, exercised through install, enable, shell
  # restart, and removal, plus real mouse/keyboard over Settings and the
  # confirmation dialog (F02, F21). Release readiness needs this job green;
  # container runs report it as skipped and never stand in for it (F23).
  real-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Real desktop validation (disposable session required)
        run: |
          if command -v omarchy >/dev/null 2>&1; then
            omarchy plugin validate .
            LINT=$(command -v qmllint-qt6 || command -v qmllint)
            "$LINT" -I /usr/share/omarchy/shell ./*.qml ./components/*.qml
            echo "real-desktop: Omarchy validation ran"
          else
            echo "SKIPPED: no Omarchy session here — run this job on a disposable graphical session per F02/F23"
          fi
